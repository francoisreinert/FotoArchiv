<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>FotoArchiv – Sicherung</title>
<style>
:root{--bg:#111315;--panel:#1a1d20;--panel2:#23272b;--line:#2e3337;--fg:#e8e9ea;--mut:#9aa0a6;--ac:#5aa9ff;--top:56px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}
button,select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.top{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:0 12px}
.top .brand{font-weight:700;font-size:18px;color:var(--fg);margin-right:6px;white-space:nowrap}
.top input[type=search]{flex:1;min-width:120px;max-width:460px}.top .cam{max-width:190px}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px;padding:6px 10px;white-space:nowrap}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.sp{flex:1}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:190px;overflow-y:auto;border-right:1px solid var(--line);padding:10px 8px;background:var(--bg);z-index:4}
.side a{display:block;color:var(--fg);padding:7px 10px;border-radius:8px}.side a.on{background:var(--panel2)}
.side .yrs{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}.side .yrs a{display:flex;padding:3px 10px;font-size:13px}
.side .yrs a small{margin-left:auto;color:var(--mut)}
main{margin-left:190px;padding:calc(var(--top) + 10px) 16px 60px}
h1{font-size:20px;margin:6px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}h1 small{color:var(--mut);font-size:13px;font-weight:normal}
h2{font-size:15px;margin:18px 0 8px;position:sticky;top:var(--top);background:var(--bg);z-index:2;padding:6px 0}h2 small{color:var(--mut);font-weight:normal;margin-left:6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,150px),1fr));gap:3px}
.c{position:relative;aspect-ratio:1;background:#1d2023;border-radius:3px;overflow:hidden;cursor:pointer}
.c img{width:100%;height:100%;object-fit:cover;display:block}.c:hover img{filter:brightness(1.12)}
.c .v{position:absolute;right:5px;bottom:4px;font-size:11px;background:rgba(0,0,0,.65);border-radius:4px;padding:0 5px;color:#fff}
.c .f{position:absolute;left:5px;top:3px;font-size:13px;color:#ffd54a;text-shadow:0 0 3px #000}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;color:var(--fg)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1d2023}.card div{padding:8px 10px}.card small{color:var(--mut);display:block}
.card.round img{aspect-ratio:1}
.cal{display:grid;grid-template-columns:70px repeat(12,minmax(0,1fr));gap:4px;align-items:stretch}
.cal .yr{font-weight:700;align-self:center}
.cal .mo{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--panel);display:block;color:#fff}
.cal .mo img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.cal .mo .m{position:absolute;left:5px;top:3px;font-size:12px;text-shadow:0 0 3px #000}.cal .mo .n{position:absolute;right:5px;bottom:3px;font-size:11px;text-shadow:0 0 3px #000}
.cal .mo .ev{position:absolute;left:0;right:0;bottom:16px;font-size:10px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.5)}
.cal .mo.empty{background:#16181a}.cal .mo.empty .m{color:var(--mut);text-shadow:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}.stat small{color:var(--mut)}
.crumbs{color:var(--mut);margin-bottom:6px}.crumbs a{margin-right:4px}
#map{height:calc(100vh - var(--top) - 90px);border-radius:10px}
.muted{color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:60px 0}
#more{height:40px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;z-index:9}#lb.on{display:block}
#lb .bar{position:absolute;left:0;right:0;top:0;height:46px;background:#000;z-index:3;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--mut);font-size:13px}
#lb .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb .m{position:absolute;top:46px;bottom:36px;left:0;right:0;display:flex;align-items:center;justify-content:center}
#lb.info .m{right:320px}
#lb img,#lb video{max-width:100%;max-height:100%;object-fit:contain}
#lb .nav{position:absolute;top:50%;width:50px;height:50px;border-radius:25px;background:rgba(0,0,0,.5);border:0;font-size:26px;color:#fff;z-index:2}
#lb .p{left:10px}#lb .n{right:10px}#lb.info .n{right:330px}
#lb .note{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:var(--mut);font-size:13px}
#lb .inf{position:absolute;top:46px;right:0;bottom:0;width:320px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow-y:auto;display:none}
#lb.info .inf{display:block}.inf dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:0}.inf dt{color:var(--mut)}.inf dd{margin:0;word-break:break-word}
.inf .chip{display:inline-block;background:var(--panel2);border-radius:12px;padding:1px 8px;margin:0 4px 4px 0;font-size:13px}
canvas.pano{width:100%;height:100%;display:block;cursor:grab}
.login{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.login input{width:100%;margin:4px 0 12px;background:#0d0f11}.login .err{color:#e88;min-height:20px}
.load{max-width:420px;margin:20vh auto;text-align:center;color:var(--mut)}.load .bar2{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:10px}
.load .bar2 i{display:block;height:100%;background:var(--ac);width:30%;animation:ld 1.2s infinite ease-in-out}@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
@media (max-width:760px){
  .side{position:fixed;top:var(--top);left:0;right:0;bottom:auto;width:auto;height:44px;display:flex;overflow-x:auto;padding:4px;border-right:0;border-bottom:1px solid var(--line)}
  .side a{white-space:nowrap;padding:6px 10px}.side .yrs{display:none}
  main{margin-left:0;padding-top:calc(var(--top) + 54px)}
  .top .brand{display:none}.top .cam{display:none}.g{--cell:105px}
  h2{top:calc(var(--top) + 44px)}
  .cal{grid-template-columns:44px repeat(6,minmax(0,1fr))}.cal .yr{grid-row:span 2}
  #lb.info .m{right:0;bottom:45%}#lb .inf{top:55%;width:auto;left:0}#lb.info .n{right:10px}
}
</style></head><body>
<div id="app"></div>
<div id="lb"><div class="bar"><button id="lbx" title="Schließen (Esc)">✕</button><span class="t" id="lbt"></span><span class="sp"></span>
<button id="lbi" title="Info (i)">ⓘ</button><a id="lbo" target="_blank" rel="noopener">Original</a></div>
<div class="m" id="lbm"></div><button class="nav p" id="lbp">‹</button><button class="nav n" id="lbn">›</button><div class="note" id="lbnote"></div><div class="inf" id="lbinf"></div></div>
<script>
"use strict";
const CFG = /*CONFIG*/{};
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (n || 0).toLocaleString("de-DE");
const LS = "fa-view|" + CFG.host + "|" + CFG.bucket;
let KEYS = null;
try { KEYS = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { KEYS = null; }

// ---------------------------------------------------------------- S3-Signatur (wie app/s3.py) ----
const enc = new TextEncoder();
const q = (s, keepSlash) => { let r = encodeURIComponent(s).replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase()); return keepSlash ? r.replace(/%2F/g, "/") : r; };
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
async function hmac(key, msg, algo = "SHA-256") {
  const k = await crypto.subtle.importKey("raw", typeof key === "string" ? enc.encode(key) : key, { name: "HMAC", hash: algo }, false, ["sign"]);
  return crypto.subtle.sign("HMAC", k, enc.encode(msg));
}
function hostPath(key) {
  if (CFG.path_style) return [CFG.host, CFG.base_path + "/" + q(CFG.bucket) + "/" + q(key, true)];
  return [CFG.bucket + "." + CFG.host, CFG.base_path + "/" + q(key, true)];
}
const NOW = new Date();
const AMZDATE = NOW.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
const DAY = AMZDATE.slice(0, 8);
let signingKey = null;
const signed = new Map();
async function sign(key) {
  if (signed.has(key)) return signed.get(key);
  const [host, path] = hostPath(key);
  let url;
  if (CFG.sig === "v2") {
    const exp = String(Math.floor(NOW.getTime() / 1000) + 7 * 86400);
    const auth = CFG.base_path + "/" + q(CFG.bucket) + "/" + q(key, true);
    const s = btoa(String.fromCharCode(...new Uint8Array(await hmac(KEYS.sk, "GET\n\n\n" + exp + "\n" + auth, "SHA-1"))));
    url = CFG.scheme + "://" + host + path + "?AWSAccessKeyId=" + q(KEYS.ak) + "&Expires=" + exp + "&Signature=" + q(s);
  } else {
    const scope = DAY + "/" + CFG.region + "/s3/aws4_request";
    const qs = [["X-Amz-Algorithm", "AWS4-HMAC-SHA256"], ["X-Amz-Credential", KEYS.ak + "/" + scope], ["X-Amz-Date", AMZDATE],
      ["X-Amz-Expires", "604800"], ["X-Amz-SignedHeaders", "host"]].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, v]) => q(k) + "=" + q(v)).join("&");
    const creq = ["GET", path, qs, "host:" + host + "\n", "host", "UNSIGNED-PAYLOAD"].join("\n");
    const sts = ["AWS4-HMAC-SHA256", AMZDATE, scope, hex(await crypto.subtle.digest("SHA-256", enc.encode(creq)))].join("\n");
    if (!signingKey) {
      let k = await hmac("AWS4" + KEYS.sk, DAY);
      for (const p of [CFG.region, "s3", "aws4_request"]) k = await hmac(k, p);
      signingKey = k;
    }
    url = CFG.scheme + "://" + host + path + "?" + qs + "&X-Amz-Signature=" + hex(await hmac(signingKey, sts));
  }
  signed.set(key, url);
  return url;
}
window.FA_SIGN = sign;  // für den Abgleich-Test

function loadScript(key) {
  return sign(key).then(url => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = () => rej(new Error("Laden fehlgeschlagen"));
    document.head.appendChild(s);
  }));
}

// ---------------------------------------------------------------- Daten ----
// Eintrag: [id, "p"|"v", "JJJJ-MM-TT HH:MM", Anzeige o|p|t, Ordner-Nr, Name, Breite, Höhe, Flags(1=Favorit,2=360°), Kamera-Nr, Ort-Nr, Dauer s, lat, lon]
let D = null;
const BY = new Map();
window.FA = { all(d) { D = d; window.__faLoaded && window.__faLoaded(); } };
async function loadAll() {
  await new Promise((res, rej) => { window.__faLoaded = res; loadScript(CFG.view + "data/all.js").catch(rej); });
  D.recs.forEach(r => BY.set(r[0], r));
  D.byDate = D.recs.slice().sort((a, b) => a[2] < b[2] ? 1 : a[2] > b[2] ? -1 : b[0] - a[0]);  // neueste zuerst
  D.personsOf = new Map();
  D.persons.forEach(p => p[2].forEach(id => { (D.personsOf.get(id) || D.personsOf.set(id, []).get(id)).push(p[1]); }));
  D.albumsOf = new Map();
  D.albums.forEach(a => a[3].forEach(id => { (D.albumsOf.get(id) || D.albumsOf.set(id, []).get(id)).push(a[1]); }));
}
const pathOf = r => (D.folders[r[4]] ? D.folders[r[4]] + "/" : "") + r[5];

// ---------------------------------------------------------------- Filter (für alle Ansichten) ----
const F = { kind: "alle", cam: "", fav: false };
try { Object.assign(F, JSON.parse(localStorage.getItem(LS + "|f") || "{}")); } catch (_) {}
const saveF = () => { try { localStorage.setItem(LS + "|f", JSON.stringify(F)); } catch (_) {} };
function filt(list) {
  const cam = F.cam === "" ? null : +F.cam;
  return list.filter(r => (F.kind === "alle" || (F.kind === "fotos" ? r[1] === "p" : F.kind === "videos" ? r[1] === "v" : (r[8] & 2)))
    && (cam === null || r[9] === cam) && (!F.fav || (r[8] & 1)));
}

// ---------------------------------------------------------------- Rahmen ----
const app = $("#app");
const NAV = [["start", "Übersicht"], ["fotos", "Fotos"], ["kalender", "Kalender"], ["alben", "Alben & Ereignisse"], ["ordner", "Ordner"],
  ["personen", "Personen"], ["karte", "Karte"], ["favoriten", "Favoriten"]];
function frame() {
  const camOpts = D.cams.map((c, i) => [c, i]).sort((a, b) => a[0].localeCompare(b[0], "de"));
  app.innerHTML = `<div class="top"><a class="brand" href="#/start">FotoArchiv</a>
    <input type="search" id="q" placeholder="Suchen: Ort, Ordner, Datei, Kamera, Person, Album, Stichwort …">
    <div class="seg" id="kind">${[["alle", "Alle"], ["fotos", "Fotos"], ["videos", "Videos"], ["360", "360°"]].map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("")}</div>
    <select class="cam" id="cam" title="Kamera"><option value="">Alle Kameras</option>${camOpts.map(([c, i]) => `<option value="${i}">${esc(c)}</option>`).join("")}</select>
    <button id="fav" title="Nur Favoriten">★</button><span class="sp"></span>${D.priv ? `<button id="privbtn" title="Private Fotos anzeigen (Passwort wie in FotoArchiv)">${PRIV ? "🔓 Privat" : "🔒 Privat"}</button>` : ""}<button id="logout" title="Schlüssel in diesem Browser vergessen">Abmelden</button></div>
    <nav class="side" id="side"></nav><main id="main"></main>`;
  const upd = () => {
    $$("#kind button").forEach(b => b.classList.toggle("on", b.dataset.k === F.kind));
    $("#cam").value = F.cam; $("#fav").classList.toggle("on", F.fav);
  };
  upd();
  $$("#kind button").forEach(b => b.onclick = () => { F.kind = b.dataset.k; saveF(); upd(); route(); });
  $("#cam").onchange = e => { F.cam = e.target.value; saveF(); route(); };
  $("#fav").onclick = () => { F.fav = !F.fav; saveF(); upd(); route(); };
  let qt = null;
  $("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { const v = e.target.value.trim(); location.hash = v ? "#/suche?q=" + encodeURIComponent(v) : "#/fotos"; }, 350); };
  if ($("#privbtn")) $("#privbtn").onclick = () => PRIV ? (location.reload()) : privDialog();
  $("#logout").onclick = () => { try { localStorage.removeItem(LS); } catch (_) {} KEYS = null; location.hash = ""; loginForm(); };
}
function side(active, years) {
  $("#side").innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" class="${k === active ? "on" : ""}">${esc(l)}</a>`).join("")
    + (years ? `<div class="yrs">${years.map(([y, n]) => `<a href="#/fotos?zu=${y}">${y === "" ? "ohne Datum" : y}<small>${num(n)}</small></a>`).join("")}</div>` : "");
}
const main = () => $("#main");

// ---------------------------------------------------------------- Raster (stückweise, mit Monats-Überschriften) ----
let current = [];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  io.unobserve(e.target);
  srcFor(e.target.dataset.k).then(u => { e.target.src = u; }).catch(() => {});
}), { rootMargin: "1200px" });
const thumbKey = id => PRIV && PRIV.tok[id] ? "enc:" + CFG.view + "x/" + PRIV.tok[id] + "t.bin" : CFG.view + "t/" + id + ".jpg";
const imgTag = id => `<img alt="" data-k="${esc(thumbKey(id))}">`;
const observe = root => $$("img[data-k]", root).forEach(im => io.observe(im));
const cell = (r, i) => `<div class="c" data-i="${i}">${imgTag(r[0])}${r[1] === "v" ? `<span class="v">▶${r[11] ? " " + dur(r[11]) : ""}</span>` : (r[8] & 2) ? '<span class="v">360°</span>' : ""}${r[8] & 1 ? '<span class="f">★</span>' : ""}</div>`;
const dur = s => s >= 3600 ? Math.floor(s / 3600) + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0") : Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const monthKey = r => r[2] ? r[2].slice(0, 7) : "";
const monthLabel = k => k ? MONTHS[+k.slice(5, 7) - 1] + " " + k.slice(0, 4) : "ohne Datum";
let gridObs = null;
function grid(box, list, opts = {}) {
  // opts.group: "month" | "day" | null; opts.start: Index, ab dem zuerst gezeigt wird
  current = list;
  if (gridObs) gridObs.disconnect();
  if (!list.length) { box.innerHTML = '<div class="empty">Keine Fotos – Filter oben prüfen.</div>'; return; }
  box.innerHTML = '<div id="gr"></div><div id="more"></div>';
  const gr = $("#gr", box);
  let pos = opts.start || 0;
  const key = opts.group === "day" ? r => (r[2] || "").slice(0, 10) : opts.group === "month" ? monthKey : null;
  const label = opts.group === "day" ? k => k ? new Date(k + "T12:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "ohne Datum" : monthLabel;
  const step = () => {
    if (pos >= list.length) { gridObs && gridObs.disconnect(); return; }
    let html = "", n = 0;
    while (pos < list.length && n < 400) {
      if (key) {
        const k = key(list[pos]);
        let end = pos;
        while (end < list.length && key(list[end]) === k) end++;
        html += `<section><h2>${esc(label(k))}<small>${num(end - pos)}</small></h2><div class="g">${list.slice(pos, end).map((r, j) => cell(r, pos + j)).join("")}</div></section>`;
        n += end - pos; pos = end;
      } else {
        const end = Math.min(list.length, pos + 400);
        html += `<div class="g">${list.slice(pos, end).map((r, j) => cell(r, pos + j)).join("")}</div>`;
        n += end - pos; pos = end;
      }
    }
    gr.insertAdjacentHTML("beforeend", html);
    observe(gr);
  };
  step();
  gridObs = new IntersectionObserver(es => { if (es[0].isIntersecting) step(); }, { rootMargin: "2000px" });
  gridObs.observe($("#more", box));
  gr.onclick = e => { const c = e.target.closest(".c"); if (c) openLb(+c.dataset.i); };
}

// ---------------------------------------------------------------- Seiten ----
function yearsOf(list) {
  const m = new Map();
  list.forEach(r => { const y = (r[2] || "").slice(0, 4); m.set(y, (m.get(y) || 0) + 1); });
  return [...m].sort((a, b) => a[0] < b[0] ? 1 : -1);
}
const P = {
  start() {
    side("start");
    const all = filt(D.byDate);
    const md = NOW.toISOString().slice(5, 10);
    const today = all.filter(r => r[2] && r[2].slice(5, 10) === md && r[2].slice(0, 4) < String(NOW.getFullYear()));
    const vids = D.recs.filter(r => r[1] === "v").length;
    main().innerHTML = `<h1>Übersicht <small>Stand der Sicherung: ${esc(D.generated.replace("T", " "))}</small></h1>
      <div class="stats"><div class="stat"><b>${num(D.total - vids)}</b><small>Fotos</small></div><div class="stat"><b>${num(vids)}</b><small>Videos</small></div>
      <div class="stat"><b>${num(Object.keys(D.pano).length)}</b><small>360°-Fotos</small></div><div class="stat"><b>${num(D.albums.length)}</b><small>Alben</small></div>
      <div class="stat"><b>${num(D.events.length)}</b><small>Ereignisse</small></div><div class="stat"><b>${num(D.persons.length)}</b><small>Personen</small></div>
      <div class="stat"><b>${num(D.places.length)}</b><small>Orte</small></div></div>
      <h1 style="margin-top:22px">An diesem Tag <small>${NOW.toLocaleDateString("de-DE", { day: "numeric", month: "long" })} in früheren Jahren</small></h1><div id="today"></div>
      <h1 style="margin-top:22px">Zuletzt <small>die neuesten Aufnahmen</small></h1><div id="recent"></div>`;
    if (today.length) grid($("#today"), today, { group: "day" }); else $("#today").innerHTML = '<div class="muted">Heute vor Jahren keine Aufnahmen.</div>';
    const recent = all.slice(0, 120);
    const box = $("#recent");
    box.innerHTML = `<div class="g">${recent.map((r, i) => cell(r, i)).join("")}</div>`;
    observe(box);
    box.onclick = e => { const c = e.target.closest(".c"); if (c) { current = recent; openLb(+c.dataset.i); } };
  },
  fotos(params) {
    const list = filt(D.byDate);
    side("fotos", yearsOf(list));

  const txt = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const P = JSON.parse(txt);
  const idx = (list, v) => { if (!v) return -1; let i = list.indexOf(v); if (i < 0) { list.push(v); i = list.length - 1; } return i; };
  for (const r of P.recs) {
    r[4] = idx(D.folders, r[4]); if (r[4] < 0) r[4] = idx(D.folders, "-");
    r[9] = idx(D.cams, r[9]); r[10] = idx(D.places, r[10]);
    D.recs.push(r); BY.set(r[0], r);
  }
  Object.assign(D.kw, P.kw); Object.assign(D.pano, P.pano);
  for (const [aid, ids] of Object.entries(P.alb)) { const a = D.albums.find(x => x[0] === +aid); if (a) a[3].push(...ids); }
  P.albums.forEach(a => { a[1] = "🔒 " + a[1]; D.albums.push(a); });
  for (const [pid, ids] of Object.entries(P.pers)) {
    const p = D.persons.find(x => x[0] === +pid);
    if (p) p[2].push(...ids); else D.persons.push([+pid, P.pnames[pid], ids]);
  }
  PRIV = { tok: P.tok };
  D.total += P.recs.length;
  D.byDate = D.recs.slice().sort((a, b) => a[2] < b[2] ? 1 : a[2] > b[2] ? -1 : b[0] - a[0]);
  D.personsOf = new Map(); D.persons.forEach(p => p[2].forEach(id => { (D.personsOf.get(id) || D.personsOf.set(id, []).get(id)).push(p[1]); }));
  D.albumsOf = new Map(); D.albums.forEach(a => a[3].forEach(id => { (D.albumsOf.get(id) || D.albumsOf.set(id, []).get(id)).push(a[1]); }));
  D.text = null;
  frame(); lastRoute = ""; route();
}

// ---------------------------------------------------------------- Anmelden / Start ----
function loginForm(msg) {
  app.innerHTML = `<form class="login"><h2 style="margin-top:0;position:static">FotoArchiv – Sicherung</h2>
    <p class="muted">${esc(CFG.name || CFG.bucket)} · ${esc(CFG.host)}<br>Zugangsschlüssel des Buckets eingeben. Sie bleiben nur in diesem Browser.</p>
    <label>Zugangsschlüssel<input id="ak" autocomplete="off" spellcheck="false"></label>
    <label>Geheimer Schlüssel<input id="sk" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="err">${esc(msg || "")}</div><button class="on" type="submit">Anmelden</button></form>`;
  $("form").onsubmit = e => {
    e.preventDefault();
    KEYS = { ak: $("#ak").value.trim(), sk: $("#sk").value.trim() };
    signingKey = null; signed.clear();
    start(true);
  };
}
async function start(remember) {
  if (!KEYS) return loginForm();
  app.innerHTML = '<div class="load">Archiv wird geladen …<div class="bar2"><i></i></div><small>einmalig etwa 2–3 MB</small></div>';
  try {
    await loadAll();
  } catch (e) {
    KEYS = null;
    try { localStorage.removeItem(LS); } catch (_) {}
    return loginForm("Anmeldung oder Verbindung fehlgeschlagen – Schlüssel prüfen.");
  }
  if (remember) try { localStorage.setItem(LS, JSON.stringify(KEYS)); } catch (_) {}
  frame();
  route();
}
if (location.protocol !== "file:" && !window.crypto?.subtle) app.innerHTML = '<div class="empty">Dieser Browser kann die Anmeldung nicht berechnen (nur über https möglich).</div>';
else start(false);
