<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotoArchiv</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
<header id="top">
  <a class="brand" href="#/start">FotoArchiv</a>
  <div id="searchbox">
    <span id="scope" hidden title="Suche und Filter gelten nur hier – ✕ sucht wieder in allen Fotos"></span>
    <div id="chips"></div>
    <input id="search" type="search" placeholder="Suchen: Ort, Ordner, Jahr, Monat, Kamera, Stichwort …" autocomplete="off">
    <div id="suggest" hidden></div>
  </div>
  <div id="kindsw" class="kindsw" title="Nur Fotos oder nur Videos zeigen (gilt für alle Ansichten)"><button data-kind="" class="on">Alle</button><button data-kind="photo">📷 Fotos</button><button data-kind="video">🎬 Videos</button><button data-kind="pano" hidden title="Nur 360°-Fotos (auch Suchwort „360“)">🌐 360°</button></div>
  <button id="camsw" class="ghost camsw" title="Nach Kamera filtern (EXIF) – zeigt die Kameras der aktuellen Ansicht">📷 Kamera ▾</button>
  <button id="filterbtn" class="ghost" title="Filter">Filter</button>
  <button id="lockbtn" class="ghost" hidden></button>
  <div id="indexstatus" hidden></div>
</header>
<div id="filters" hidden>
  <label>Von <input type="date" id="f-from"></label>
  <label>Bis <input type="date" id="f-to"></label>
  <label>Art
    <select id="f-kind"><option value="">Alles</option><option value="photo">Fotos</option><option value="video">Videos</option><option value="raw">nur RAW</option><option value="pano">nur 360°-Fotos</option></select>
  </label>
  <label><input type="checkbox" id="f-fav"> nur Favoriten</label>
  <label><input type="checkbox" id="f-nodate"> ohne sicheres Datum</label>
  <label><input type="checkbox" id="f-dups"> Duplikate &amp; RAW-Kopien zeigen</label>
  <label>Belichtungsreihen
    <select id="f-stacks"><option value="">zusammengefasst</option><option value="open">einzeln zeigen</option><option value="only">nur Belichtungsreihen</option></select>
  </label>
  <label>Sortierung
    <select id="f-sort"><option value="desc">Neueste zuerst</option><option value="asc">Älteste zuerst</option></select>
  </label>
  <button id="f-reset" class="ghost">Zurücksetzen</button>
</div>
<div id="layout">
  <nav id="side">
    <a href="#/start" data-nav="start">Übersicht</a>
    <a href="#/fotos" data-nav="fotos">Fotos</a>
    <a href="#/kalender" data-nav="kalender">Kalender</a>
    <a href="#/alben" data-nav="alben">Alben &amp; Ereignisse</a>
    <a href="#/ordner" data-nav="ordner">Ordner</a>
    <a href="#/personen" data-nav="personen">Personen</a>
    <a href="#/karte" data-nav="karte">Karte</a>
    <a href="#/favoriten" data-nav="favoriten">Favoriten</a>
    <a href="#/dokumente" data-nav="dokumente">Dokumente</a>
    <a href="#/video" data-nav="video">Videoschnitt</a>
    <a href="#/import" data-nav="import">Import</a>
    <a href="#/einstellungen" data-nav="einstellungen">Bibliothek</a>
    <a href="#/duplikate" data-nav="duplikate">Duplikate</a>
    <a href="#/papierkorb" data-nav="papierkorb">Papierkorb</a>
    <a href="#/sicherung" data-nav="sicherung">Sicherung</a>
    <div id="years"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="viewer" hidden>
  <div class="v-stage">
    <div class="v-media"></div>
    <button class="v-nav v-prev" title="Zurück (←)">‹</button>
    <button class="v-nav v-next" title="Weiter (→)">›</button>
  </div>
  <div class="v-bar">
    <button class="v-close" title="Schließen (Esc)">✕</button>
    <span class="v-title"></span>
    <span class="v-spacer"></span>
    <button class="v-rotl" title="Nach links drehen">⟲</button>
    <button class="v-rotr" title="Nach rechts drehen (R)">⟳</button>
    <button class="v-edit" title="Bearbeiten (E)">✎ Bearbeiten</button>
    <button class="v-vadd" title="Zum Videoprojekt hinzufügen (Shift+Klick: anderes Projekt)">🎬 + Video</button>
    <button class="v-tv" title="Auf dem Fernseher / Frame zeigen">📺</button>
    <button class="v-faces" title="Gesichter zeigen (G)">Gesichter</button>
    <button class="v-fav" title="Favorit (F)">☆</button>
    <button class="v-del" title="In den Papierkorb (Entf)">🗑</button>
    <button class="v-info" title="Informationen (I)">Info</button>
  </div>
  <aside class="v-panel" hidden></aside>
</div>
<div id="selbar" hidden>
  <button class="ghost sb-close" title="Auswahl aufheben (Esc)">✕</button>
  <b class="sb-count"></b>
  <button class="ghost sb-all" title="Alle auswählen (Strg+A)">Alle</button>
  <span class="sb-spacer"></span>
  <button data-act="dockeep" class="docbtn primary" hidden title="Dauerhaft behalten – Album „Dokumente“, nicht in der Zeitleiste">✓ Behalten</button>
  <button data-act="docsort" class="docbtn" hidden title="Aus der Zeitleiste nehmen, unter „Neu“ entscheiden">Einsortieren</button>
  <button data-act="docno" class="docbtn" hidden title="Kein Dokument – zurück in die Zeitleiste, wird nie wieder einsortiert">Kein Dokument</button>
  <button data-act="del" class="docbtn danger" hidden title="Kurzlebige Dokumentfotos in den Papierkorb">🗑 Papierkorb</button>
  <button data-act="show" title="Diashow mit den markierten Fotos">▶ Diashow</button>
  <button data-act="share" title="Exportieren / teilen">Teilen …</button>
  <button data-act="fav" title="Als Favorit markieren">★ Favorit</button>
  <button data-act="album" title="Zu einem Album hinzufügen">+ Album</button>
  <button data-act="event" title="Ereignis aus diesen Fotos erstellen">+ Ereignis</button>
  <button data-act="person" title="Person zuordnen">+ Person</button>
  <button data-act="tag" title="Stichwort hinzufügen">+ Stichwort</button>
  <button data-act="video" title="In ein Videoprojekt übernehmen">🎬 Video</button>
  <button data-act="more" title="Weitere Aktionen">Mehr …</button>
</div>
<div id="tvbar" hidden></div>
<div id="jobbar" hidden></div>
<div id="opbar" hidden></div>
<div id="toast" hidden></div>
<script src="/app.js"></script>
<script src="/editor.js"></script>
<script src="/video.js"></script>
<script src="/backup.js"></script>
<script src="/pano.js"></script>
</body>
</html>
